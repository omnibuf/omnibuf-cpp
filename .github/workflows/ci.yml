name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: C++20 Build, Test, Sanitizers & Conformance
    runs-on: ubuntu-26.04
    env:
      CXX: clang++
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install tools via mise
        uses: jdx/mise-action@v5
        with:
          install: true

      - name: Install conformance-runner
        run: |
          mise use -g go@1.27
          GOBIN="$HOME/.local/bin" mise exec -- go install github.com/omnibuf/omnibuf-go/cmd/conformance-runner@71dad83aadd7dc65401d662521d34cfaeb1011ab
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run full CI suite
        run: just ci

      - name: Run ASan & UBSan unit test suite
        run: |
          cmake -B build-san -DCMAKE_BUILD_TYPE=Debug -DOMNIBUF_ENABLE_SANITIZERS=ON
          cmake --build build-san --target omnibuf_tests audit_regressions protoc-gen-omnibuf-cpp -j
          ctest --test-dir build-san --output-on-failure
