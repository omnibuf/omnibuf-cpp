name: Release & Publish protoc-gen-omnibuf-cpp Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Full C++20 CI & Conformance Gate
    runs-on: ubuntu-24.04
    env:
      CXX: clang++
    steps:
      - uses: actions/checkout@v7

      - name: Install tools via mise
        uses: jdx/mise-action@v5
        with:
          install: true

      - name: Install conformance-runner
        run: |
          mise use -g go@1.27
          GOBIN="$HOME/.local/bin" mise exec -- go install github.com/omnibuf/omnibuf-go/cmd/conformance-runner@71dad83aadd7dc65401d662521d34cfaeb1011ab
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run full CI suite
        run: just ci

  build:
    name: Build protoc-gen-omnibuf-cpp (${{ matrix.os_label }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            os_label: linux-amd64
            ext: tar.gz
          - runner: ubuntu-24.04-arm
            os_label: linux-arm64
            ext: tar.gz
          - runner: macos-latest
            os_label: darwin-arm64
            ext: tar.gz
          - runner: macos-15-intel
            os_label: darwin-amd64
            ext: tar.gz
          - runner: windows-latest
            os_label: windows-amd64
            ext: zip
    steps:
      - uses: actions/checkout@v7

      - name: Build protoc-gen-omnibuf-cpp (Release)
        shell: bash
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DOMNIBUF_BUILD_TESTS=OFF -DOMNIBUF_BUILD_PLUGIN=ON
          cmake --build build --config Release --target protoc-gen-omnibuf-cpp -j

      - name: Package archive
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          STAGE="dist/protoc-gen-omnibuf-cpp-${VERSION}-${{ matrix.os_label }}"
          mkdir -p "$STAGE"
          if [[ "${{ matrix.os_label }}" == windows-* ]]; then
            BIN=$(find build -name "protoc-gen-omnibuf-cpp.exe" | head -n 1)
            cp "$BIN" "$STAGE/protoc-gen-omnibuf-cpp.exe"
          else
            cp build/protoc-gen-omnibuf-cpp "$STAGE/protoc-gen-omnibuf-cpp"
            chmod +x "$STAGE/protoc-gen-omnibuf-cpp"
          fi
          cp LICENSE README.md "$STAGE/"
          cp -R include "$STAGE/include"
          if [[ "${{ matrix.ext }}" == "zip" ]]; then
            python3 -c '
          import pathlib, shutil
          shutil.make_archive("dist/protoc-gen-omnibuf-cpp-${{ matrix.os_label }}", "zip", "dist", "'"$(basename "$STAGE")"'")
          '
          else
            tar -C dist -czf "dist/protoc-gen-omnibuf-cpp-${{ matrix.os_label }}.tar.gz" "$(basename "$STAGE")"
          fi
          rm -rf "$STAGE"

      - uses: actions/upload-artifact@v6
        with:
          name: cpp-dist-${{ matrix.os_label }}
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: cpp-dist-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums and publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd dist && sha256sum protoc-gen-omnibuf-cpp-* > checksums.txt)
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" -R omnibuf/omnibuf-cpp >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber -R omnibuf/omnibuf-cpp
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes -R omnibuf/omnibuf-cpp
          fi
