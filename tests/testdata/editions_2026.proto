edition = "2026";

package omnibuf.editions.e2026;

export enum E26Mode {
  E26_MODE_UNSPECIFIED = 0;
  E26_MODE_FAST = 1;
  E26_MODE_SAFE = 2;
}

export message E26Child {
  int32 seq = 1;
  string tag = 2;
}

export message Edition2026Record {
  int32 count = 1;
  double ratio = 2;
  bool active = 3;
  string title = 4;
  bytes raw = 5;
  E26Mode mode = 6;
  int32 implicit_rank = 7 [features.field_presence = IMPLICIT];

  E26Child delimited_child = 8 [features.message_encoding = DELIMITED];
  repeated E26Child delimited_items = 9 [features.message_encoding = DELIMITED];
  repeated int32 expanded_ids = 10 [features.repeated_field_encoding = EXPANDED];
  map<string, int32> weights = 11;
  map<string, E26Child> children = 12;

  oneof variant {
    int32 num = 13;
    bool flag = 14;
    string text = 15;
    E26Child child = 16;
  }
}
