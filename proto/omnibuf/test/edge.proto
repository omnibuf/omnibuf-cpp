syntax = "proto3";
package omnibuf.test;

enum EdgeStatus {
  EDGE_STATUS_UNSPECIFIED = 0;
  EDGE_STATUS_READY = 1;
  EDGE_STATUS_DRAINING = 2;
  EDGE_STATUS_OFFLINE = -3;
}

message EdgeShowcase {
  enum NestedMode {
    NESTED_MODE_UNSPECIFIED = 0;
    NESTED_MODE_FAST = 1;
    NESTED_MODE_SAFE = 2;
  }

  message InnerPayload {
    uint32 code = 1;
    string detail = 2;
    InnerPayload next_inner = 3;
  }

  optional uint32 opt_count = 1;
  optional bool opt_flag = 2;
  optional string opt_label = 3;
  optional EdgeStatus opt_status = 4;

  repeated EdgeStatus statuses = 5;
  repeated NestedMode modes = 6;

  map<int32, InnerPayload> by_id = 7;
  map<bool, EdgeStatus> by_flag = 8;
  map<string, string> annotations = 9;
  map<fixed64, bytes> blobs = 10;

  oneof action {
    uint32 action_code = 11;
    string action_name = 12;
    bool action_toggle = 13;
    InnerPayload action_payload = 14;
  }

  string and = 15;
  uint32 class = 16;
  bool clear = 17;
  uint32 schema_meta = 18;
}

message WideMessage {
  uint32 f1 = 1;
  uint32 f2 = 2;
  uint32 f3 = 3;
  uint32 f4 = 4;
  uint32 f5 = 5;
  uint32 f6 = 6;
  uint32 f7 = 7;
  uint32 f8 = 8;
  uint32 f9 = 9;
  uint32 f10 = 10;
  uint32 f11 = 11;
  uint32 f12 = 12;
  uint32 f13 = 13;
